name: CD - CICD

on:
  push:
    branches: ["master"]   # Kører ved hvert push til master

env:
  REGISTRY: ghcr.io                # GitHub Container Registry, hvor imaget bliver gemt
  IMAGE_NAME: "cicd-template"      # Navnet på imaget (skal være med små bogstaver)

jobs:
  build-and-deploy:
    name: Build and Deploy CiCd
    runs-on: ubuntu-latest

    # Rettigheder til den automatiske GITHUB_TOKEN:
    permissions:
      contents: read     # Læse koden i repoet
      packages: write    # Skrive (pushe) images til ghcr.io

    steps:
      # Kloner repoet ind på runneren, så Docker kan se Dockerfile og kildekode
      - name: Get Code
        uses: actions/checkout@v5

      # Logger ind på ghcr.io, så vi har lov til at pushe imaget.
      # github.actor = brugeren der udløste workflowet
      # GITHUB_TOKEN laves automatisk af GitHub, du skal ikke selv oprette den
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bygger Docker-imaget ud fra Dockerfilen og pusher det til ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/CiCd                         # Mappen Docker bygger ud fra (se note nedenfor)     
          push: true                        # Push imaget efter build
          # Fuldt image-navn: ghcr.io/<ejer>/cicd-template:latest
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
